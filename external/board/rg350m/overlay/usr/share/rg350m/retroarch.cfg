# RG350M-SYS defaults (copied to ~/.retroarch/retroarch.cfg on first start)
libretro_directory = "/usr/lib/libretro"
system_directory = "/media/data/bios"
savefile_directory = "~/.retroarch/saves"
savestate_directory = "~/.retroarch/states"
screenshot_directory = "~/.retroarch/screenshots"
config_save_on_exit = "true"
menu_driver = "rgui"
video_driver = "sdl_dingux"
input_driver = "sdl_dingux"
input_joypad_driver = "sdl_dingux"
video_dingux_ipu_keep_aspect = "true"
video_dingux_ipu_filter_type = "0"
video_scale_integer = "false"
audio_latency = "64"
fps_show = "false"
pause_nonactive = "false"
quit_press_twice = "false"
menu_show_core_updater = "false"
menu_show_online_updater = "false"
quit_on_close_content = "1"

# Hotkeys: hold SELECT and press
#   START = quit to EmulationStation    X  = RetroArch menu
#   R1    = save state                  L1 = load state
#   R2    = fast forward                L2 = rewind (if enabled)
# Button numbers are RetroPad IDs: B=0 Y=1 SELECT=2 START=3 UP=4 DOWN=5
# LEFT=6 RIGHT=7 A=8 X=9 L1=10 R1=11 L2=12 R2=13 L3=14 R3=15
input_enable_hotkey_btn = "2"
input_exit_emulator_btn = "3"
input_menu_toggle_btn = "9"
input_save_state_btn = "11"
input_load_state_btn = "10"
input_toggle_fast_forward_btn = "13"
input_rewind_btn = "12"
